<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website brief · OZ Leads</title>
  <style>
    :root {
      --paper: #f3eee6;
      --ink: #1c1916;
      --muted: #6d645b;
      --line: #e0d6c8;
      --brass: #8a7049;
      --field: #fffdf9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 17px/1.5 Georgia, "Iowan Old Style", Palatino, serif;
    }
    .wrap { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1.2rem 4rem; }
    .kicker {
      margin: 0;
      font: 600 11px/1 system-ui, sans-serif;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--brass);
    }
    h1 { font-weight: 500; font-size: 2.5rem; line-height: 1.05; margin: .55rem 0 .4rem; }
    h2 { font-weight: 500; font-size: 1.35rem; margin: 1.7rem 0 .25rem; }
    .lede, .hint { color: var(--muted); margin: 0 0 .8rem; }
    .hint { font: 14px/1.45 system-ui, sans-serif; }
    label { display: block; margin: .85rem 0 0; font: 13px/1.3 system-ui, sans-serif; }
    input {
      display: block;
      width: 100%;
      margin-top: .35rem;
      padding: .7rem .75rem;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--ink);
      font: 16px/1.4 system-ui, sans-serif;
    }
    input[type="file"] { padding: .45rem 0; border: 0; background: transparent; }
    .req::after { content: " *"; color: var(--brass); }
    .two { display: grid; gap: 0 .8rem; }
    @media (min-width: 700px) { .two { grid-template-columns: 1fr 1fr; } }
    button {
      margin-top: 1.4rem;
      border: 0;
      background: var(--ink);
      color: var(--paper);
      padding: .85rem 1.15rem;
      font: 13px/1 system-ui, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button.ghost {
      margin-top: .8rem;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .foot { margin-top: 1rem; color: var(--muted); font: 13px/1.4 system-ui, sans-serif; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="kicker">OZ Leads</p>
    <h1>Website brief</h1>
    <p class="lede">Name, phone, and city. Then what you do, where you work, a few photos, and a link.</p>

    <form action="/submit" method="post" enctype="multipart/form-data">
      <div class="two">
        <label><span class="req">Business name</span>
          <input name="businessName" required maxlength="200" autocomplete="organization" placeholder="Harbor &amp; Pine Remodeling">
        </label>
        <label><span class="req">Phone</span>
          <input name="phone" type="tel" required maxlength="40" autocomplete="tel" placeholder="(555) 010-0148">
        </label>
        <label><span class="req">City</span>
          <input name="city" required maxlength="80" autocomplete="address-level2" placeholder="Austin">
        </label>
        <label>Email
          <input name="email" type="email" maxlength="200" autocomplete="email" placeholder="Optional">
        </label>
      </div>

      <h2>Services</h2>
      <p class="hint">What you do. Add another if you need it.</p>
      <div id="service-list">
        <label>Service
          <input name="serviceName" maxlength="120" placeholder="Kitchens">
        </label>
        <label>Service
          <input name="serviceName" maxlength="120" placeholder="Doors">
        </label>
      </div>
      <button type="button" class="ghost" id="add-service">Add a service</button>

      <h2>Area</h2>
      <label>Where you work
        <input name="serviceArea" maxlength="300" placeholder="Cities, or 30 miles around Austin">
      </label>

      <h2>Pictures</h2>
      <p class="hint">JPG, PNG, WEBP, or GIF. Up to 15 MB each.</p>
      <label>Logo
        <input type="file" name="logo" accept="image/jpeg,image/png,image/webp,image/gif">
      </label>
      <div id="photo-list">
        <label>Work photo
          <input type="file" name="project_0" accept="image/jpeg,image/png,image/webp,image/gif">
        </label>
        <label>Work photo
          <input type="file" name="project_1" accept="image/jpeg,image/png,image/webp,image/gif">
        </label>
        <label>Work photo
          <input type="file" name="project_2" accept="image/jpeg,image/png,image/webp,image/gif">
        </label>
      </div>
      <button type="button" class="ghost" id="add-photo">Add a photo</button>

      <h2>Links</h2>
      <div class="two">
        <label>Instagram
          <input name="instagram" maxlength="300" placeholder="https://instagram.com/…">
        </label>
        <label>Other link
          <input name="otherSocial" maxlength="300" placeholder="Facebook, Google, or a website">
        </label>
      </div>

      <button type="submit">Send</button>
      <p class="foot">Takes a minute. We'll look up the rest.</p>
    </form>
  </main>
  <script>
    document.getElementById('add-service').addEventListener('click', function () {
      var list = document.getElementById('service-list');
      if (list.querySelectorAll('input').length >= 8) return;
      var label = document.createElement('label');
      label.appendChild(document.createTextNode('Service'));
      var input = document.createElement('input');
      input.name = 'serviceName';
      input.maxLength = 120;
      input.placeholder = 'Another service';
      label.appendChild(input);
      list.appendChild(label);
    });
    var photoCount = 3;
    document.getElementById('add-photo').addEventListener('click', function () {
      if (photoCount >= 6) return;
      var label = document.createElement('label');
      label.appendChild(document.createTextNode('Work photo'));
      var input = document.createElement('input');
      input.type = 'file';
      input.name = 'project_' + photoCount;
      input.accept = 'image/jpeg,image/png,image/webp,image/gif';
      label.appendChild(input);
      document.getElementById('photo-list').appendChild(label);
      photoCount += 1;
    });
  </script>
</body>
</html>
