<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website brief · OZ Leads</title>
  <style>
    :root {
      --paper: #f3eee6;
      --ink: #1c1916;
      --muted: #6d645b;
      --line: #e0d6c8;
      --brass: #8a7049;
      --field: #fffdf9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 17px/1.5 Georgia, "Iowan Old Style", Palatino, serif;
    }
    .wrap { max-width: 28rem; margin: 0 auto; padding: 2.5rem 1.2rem 4rem; }
    .kicker {
      margin: 0;
      font: 600 11px/1 system-ui, sans-serif;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--brass);
    }
    h1 { font-weight: 500; font-size: 2.5rem; line-height: 1.05; margin: .55rem 0 .4rem; }
    .lede { color: var(--muted); margin: 0 0 1.4rem; }
    label { display: block; margin: .85rem 0 0; font: 13px/1.3 system-ui, sans-serif; }
    input {
      display: block;
      width: 100%;
      margin-top: .35rem;
      padding: .7rem .75rem;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--ink);
      font: 16px/1.4 system-ui, sans-serif;
    }
    .req::after { content: " *"; color: var(--brass); }
    label span { font: inherit; }
    button {
      margin-top: 1.4rem;
      border: 0;
      background: var(--ink);
      color: var(--paper);
      padding: .85rem 1.15rem;
      font: 13px/1 system-ui, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .foot { margin-top: 1rem; color: var(--muted); font: 13px/1.4 system-ui, sans-serif; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="kicker">OZ Leads</p>
    <h1>Website brief</h1>
    <p class="lede">Name, phone, and city. That's enough. We'll find the rest.</p>

    <form action="/submit" method="post" enctype="multipart/form-data">
      <label><span class="req">Business name</span>
        <input name="businessName" required maxlength="200" autocomplete="organization" placeholder="Harbor &amp; Pine Remodeling">
      </label>
      <label><span class="req">Phone</span>
        <input name="phone" type="tel" required maxlength="40" autocomplete="tel" placeholder="(555) 010-0148">
      </label>
      <label><span class="req">City</span>
        <input name="city" required maxlength="80" autocomplete="address-level2" placeholder="Austin">
      </label>
      <label>Email
        <input name="email" type="email" maxlength="200" autocomplete="email" placeholder="Optional">
      </label>
      <button type="submit">Send</button>
      <p class="foot">Takes a minute. We'll look up the rest.</p>
    </form>
  </main>
</body>
</html>
